services:
  - type: web
    name: sharecar
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn sharecar_project.wsgi:application"
    plan: free
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: sharecar-db
          property: connectionString

databases:
  - name: sharecar-db
    plan: free
